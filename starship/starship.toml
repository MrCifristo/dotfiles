# ════════════════════════════════════════════════════════════
#  Starship — prompt NERV
#  A juego con la paleta de ~/.config/kitty/nerv.conf
#
#  Todos los glifos usados están verificados contra
#  JetBrainsMono Nerd Font — no hay fallbacks descuadrados.
# ════════════════════════════════════════════════════════════

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[╭─](bold #7c3aed)$os$directory$git_branch$git_status$nodejs$python$rust$golang$java$docker_context$cmd_duration
[╰─](bold #7c3aed)$character"""

add_newline = true
command_timeout = 1000

# ── sistema ─────────────────────────────────────────────────
[os]
disabled = false
style = 'bold #7c3aed'
format = '[$symbol]($style) '

[os.symbols]
Fedora = ''
Macos = ''

# ── directorio ──────────────────────────────────────────────
[directory]
style = 'bold #22d3ee'
format = '[$path]($style)[$read_only]($read_only_style) '
truncation_length = 3
truncate_to_repo = true
truncation_symbol = '…/'
read_only = ' '
read_only_style = 'bold #ef4444'

# ── git ─────────────────────────────────────────────────────
[git_branch]
symbol = ' '
style = '#a78bfa'
format = '[$symbol$branch]($style) '

[git_status]
style = 'bold #ef4444'
format = '([$all_status$ahead_behind]($style))'
conflicted = '~${count} '
ahead      = '↑${count} '
behind     = '↓${count} '
diverged   = '↑${ahead_count}↓${behind_count} '
untracked  = '?${count} '
stashed    = ' ${count} '
modified   = '!${count} '
staged     = '+${count} '
renamed    = '»${count} '
deleted    = '✕${count} '

# ── duración del último comando ─────────────────────────────
[cmd_duration]
min_time = 2000
style = '#eab308'
format = '[ $duration]($style) '

# ── el cursor ───────────────────────────────────────────────
[character]
success_symbol = '[❯](bold #a3e635)'
error_symbol   = '[❯](bold #ef4444)'
vimcmd_symbol  = '[❮](bold #f97316)'

# ── lenguajes: solo aparecen si el proyecto los usa ─────────
[nodejs]
symbol = ' '
style  = '#a3e635'
format = '[$symbol($version )]($style)'

[python]
symbol = ' '
style  = '#eab308'
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'

[rust]
symbol = ' '
style  = '#f97316'
format = '[$symbol($version )]($style)'

[golang]
symbol = ' '
style  = '#22d3ee'
format = '[$symbol($version )]($style)'

[java]
symbol = ' '
style  = '#f97316'
format = '[$symbol($version )]($style)'

[docker_context]
symbol = ' '
style  = '#22d3ee'
format = '[$symbol$context]($style) '
