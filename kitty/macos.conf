# ══════════════════════════════════════════════════════════
#  kitty — ajustes solo para macOS (lo incluye kitty.conf)
# ══════════════════════════════════════════════════════════
# Cmd+N es el atajo nativo de ventana nueva en macOS.
map cmd+n launch --type=os-window --cwd=current --env NERV_FETCH=1

# Sin barra de título pero con esquinas redondeadas y ventana arrastrable.
hide_window_decorations titlebar-only

# Option como Alt (para atajos tipo alt+b / alt+f en la shell).
macos_option_as_alt yes
macos_quit_when_last_window_closed yes
