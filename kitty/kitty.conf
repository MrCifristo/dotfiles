# ══════════════════════════════════════════════════════════
#  kitty  —  configuración NERV
# ══════════════════════════════════════════════════════════

# ── Fuente ────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# ── Ventana: sin barra de título ni marco ─────────────────
hide_window_decorations yes
window_padding_width    10
confirm_os_window_close 0
remember_window_size    yes

# ── Transparencia y desenfoque ────────────────────────────
# kitty le pide el blur a KWin directamente (protocolo KDE),
# no hace falta ninguna regla de ventana.
# Ctrl+Shift+A y luego M / L ajustan la opacidad en caliente.
background_opacity         0.88
background_blur            32
dynamic_background_opacity yes

# ── Cursor ────────────────────────────────────────────────
cursor_shape          beam
cursor_blink_interval 0.5

# ── Scrollback y campana ──────────────────────────────────
scrollback_lines  10000
enable_audio_bell no

# ── Pestañas ──────────────────────────────────────────────
tab_bar_edge        top
tab_bar_style       powerline
tab_powerline_style slanted
tab_title_template  "{index}: {title}"

# ── Varios ────────────────────────────────────────────────
allow_remote_control yes
shell_integration    enabled
copy_on_select       no

# ── Fetch de arranque ─────────────────────────────────────
# La primera ventana la marca esta sesión:
startup_session ~/.config/kitty/nerv.session

# Ctrl+Shift+N (ventana nueva del SO) TAMBIÉN dispara el fetch.
# Ctrl+Shift+T (pestaña) y Ctrl+Shift+Enter (split) NO lo hacen,
# para que no te salga el fetch cada vez que abres un split.
# El atajo concreto vive en linux.conf / macos.conf (se elige solo
# según el sistema; kitty exporta KITTY_OS al leer la config).
include ${KITTY_OS}.conf

# ── Paleta ────────────────────────────────────────────────
include nerv.conf
